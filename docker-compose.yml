# Local development database only. Credentials come from your local .env
# file (never committed). See .env.example.
services:
  db:
    image: postgres:16
    container_name: counselor-insights-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Host port 5433 so it never collides with another Postgres on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - counselor_insights_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  counselor_insights_pgdata:
